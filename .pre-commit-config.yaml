repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
        stages: [pre-commit]

      - id: ruff
        name: ruff lint
        entry: uv run ruff check
        language: system
        types: [python]
        stages: [pre-commit]

      - id: compileall
        name: compileall preflight
        entry: python -m compileall src tests scripts
        language: system
        pass_filenames: false
        stages: [pre-commit]

      - id: pytest
        name: pytest preflight
        entry: uv run pytest -q
        language: system
        pass_filenames: false
        stages: [pre-push]

      - id: mypy
        name: mypy static typing
        entry: uv run mypy
        language: system
        pass_filenames: false
        stages: [pre-push]

      - id: import-linter
        name: architecture boundaries
        entry: uv run lint-imports
        language: system
        pass_filenames: false
        stages: [pre-push]
